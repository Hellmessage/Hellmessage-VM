[package]
name = "hvm-guest-helper"
version = "0.1.0"
edition = "2021"
authors = ["HVM team"]
description = "HVM guest helper service for Windows — file-clipboard paste-where-you-paste via virtio-serial"
license = "GPL-2.0-only"

[[bin]]
name = "hvm-guest-helper"
path = "src/main.rs"

[dependencies]
# windows-rs: 官方 Win32 binding. 用 0.59 (2025-12, 稳定).
# 按需启用 feature 控编译体积, 不一股脑全开.
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",              # CreateFileW 的 SECURITY_ATTRIBUTES 依赖
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",   # OpenClipboard / SetClipboardData
    "Win32_System_Ole",            # OleSetClipboard (preferred over raw SetClipboardData)
    "Win32_System_Memory",         # GlobalAlloc / GlobalLock for CF_HDROP
    "Win32_System_IO",             # CreateFile / ReadFile / WriteFile
    "Win32_System_Threading",      # Sleep for retry
] }

# 协议: JSON 编解码
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# exec stdout/stderr + write-file/read-file blob 的 base64 编解码 (helper 自有 crate, 不在 Swift 白名单内)
base64 = "0.22"

[profile.release]
# 优化 EXE 大小: 单二进制, 不需要 debug 符号. helper 是常驻进程, 一次启动到 VM 寿命终, 不
# 高频热路径, 牺牲性能换体积划得来.
opt-level = "z"        # 优化大小, 比 "s" 更激进
lto = true             # 跨 crate 优化
codegen-units = 1      # LTO 友好, 编译慢但体积小
strip = true           # 不带符号
panic = "abort"        # 不展开 panic, 体积省一截 (helper 出错直接 abort + 自启重启即可)

# 构建 (从 macOS 编 Windows ARM64): 走 ./build.sh —— 出【无 DLL 单 exe】.
#   gnullvm 链接需 llvm-mingw 的 aarch64-w64-mingw32-clang 驱动 (rust 自带 rust-lld 不够);
#   build.sh 用 RUSTFLAGS=-C target-feature=+crt-static 静态链 libunwind.a/libc++.a/ucrt,
#   产物只依赖 Windows 系统 DLL, 无 libunwind.dll. llvm-mingw 放 third_party/llvm-mingw/
#   (github.com/mstorsjo/llvm-mingw, ucrt-macos-universal) 或设 HVM_LLVM_MINGW.
#   build.sh 末尾硬校验"无非系统 DLL", 并拷到 dist/aarch64/ 供 bundle.sh 取.
